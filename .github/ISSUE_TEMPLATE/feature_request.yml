name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the workflow problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Affected source
      options:
        - All sources
        - World of Warships: Legends
        - World of Warships PC
        - Korabli
        - GUI / viewer / installer
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not require redistributing proprietary game assets or libraries.
          required: true
