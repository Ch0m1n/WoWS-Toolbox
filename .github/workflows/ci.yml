name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Generate source manifest
        shell: pwsh
        run: .\Update-SourceManifest.ps1

      - name: Run self-tests with bundled Python
        shell: pwsh
        run: .\Run-SelfTests.ps1 -Python .\Runtime\Python\python.exe
