name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Normalize Windows temporary directory aliases
        shell: pwsh
        run: |
          $tempRoot = & .\Runtime\Python\python.exe -B -c "from pathlib import Path; import tempfile; print(Path(tempfile.gettempdir()).resolve())"
          if ($LASTEXITCODE -ne 0) { throw 'Temporary directory resolution failed.' }
          "TEMP=$tempRoot" >> $env:GITHUB_ENV
          "TMP=$tempRoot" >> $env:GITHUB_ENV

      - name: Generate source manifest
        shell: pwsh
        run: .\Update-SourceManifest.ps1

      - name: Run self-tests with bundled Python
        shell: pwsh
        run: .\Run-SelfTests.ps1 -Python .\Runtime\Python\python.exe
