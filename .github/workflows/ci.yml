name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Generate source manifest
        shell: pwsh
        run: .\Update-SourceManifest.ps1

      - name: Run self-tests
        shell: pwsh
        run: .\Run-SelfTests.ps1
